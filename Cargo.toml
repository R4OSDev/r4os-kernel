[package]
name = "r4os-kernel"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false

[lib]
path = "Rust/lib.rs"
crate-type = ["rlib"]

[[bin]]
name = "r4os"
path = "Rust/main.rs"
test = false
bench = false

[dependencies]
r4os-contract = { version = "=0.1.0" }

r4os-text-core = { version = "=0.1.1" }

[profile.release]
opt-level = 3
overflow-checks = true
debug-assertions = true
panic = "abort"
lto = false
