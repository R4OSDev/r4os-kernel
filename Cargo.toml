[package]
name = "r4os-kernel"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false

[lib]
path = "Rust/lib.rs"
crate-type = ["rlib"]

[[bin]]
name = "r4os"
path = "Rust/main.rs"
test = false
bench = false

[dependencies]
r4os-contract = { git = "https://github.com/R4OSDev/r4os-contract.git", rev = "83adde8379270ffeb721e5c7e38de21c0ed3f286" }

r4os-text-core = { git = "https://github.com/R4OSDev/r4os-libraries.git", rev = "86586b02ebe88b06a11ae71d4a41be19efca4330" }

[profile.release]
opt-level = 3
overflow-checks = true
debug-assertions = true
panic = "abort"
lto = false
