[package]
name = "r4os-kernel"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false

[lib]
path = "Rust/lib.rs"
crate-type = ["rlib"]

[[bin]]
name = "r4os"
path = "Rust/main.rs"
test = false
bench = false

[dependencies]
r4os-contract = { git = "https://github.com/R4OSDev/r4os-contract.git", rev = "03195b2a2e7461c72a4d0d6b645ae24319ba6315" }

[profile.release]
opt-level = 3
overflow-checks = true
debug-assertions = true
panic = "abort"
lto = false
