[package]
name = "r4os-kernel"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false

[lib]
path = "Rust/lib.rs"
crate-type = ["rlib"]

[[bin]]
name = "r4os"
path = "Rust/main.rs"
test = false
bench = false

[dependencies]
r4os-contract = { git = "https://github.com/R4OSDev/r4os-contract.git", rev = "973dfbd67198cd63faa788ff56c2abb81efc5af4" }

r4os-text-core = { git = "https://github.com/R4OSDev/r4os-libraries.git", rev = "8bb663fa8cf2e002c585656974857f9fe2afcec3" }

[profile.release]
opt-level = 3
overflow-checks = true
debug-assertions = true
panic = "abort"
lto = false
