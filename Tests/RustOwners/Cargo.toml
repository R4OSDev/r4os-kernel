[package]
name = "r4os-kernel-owner-fixture"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false

[lib]
path = "src/lib.rs"
crate-type = ["staticlib"]

[dependencies]
r4os-contract = { git = "https://github.com/R4OSDev/r4os-contract.git", rev = "213a2bd50a7f40d88f5ff7ac87b4ef03ee8e3057" }

[profile.release]
opt-level = 3
overflow-checks = true
debug-assertions = true
panic = "abort"
lto = false
